; PlatformIO build for the hand firmware. One sketch, two environments that
; differ only in TACTILE_HAND_RIGHT. See ../BUILD.md, section 3.
;
;   pio run -e left                                  compile only
;   pio run -e left  -t upload -t monitor            flash + serial log
;   pio run -e right -t upload --upload-port /dev/cu.usbserial-XXXX
;
; The official "espressif32" platform only ships Arduino core 2.x; pioarduino
; provides core 3.x, which is what the firmware was written against. Pinned to
; 55.03.312 (Arduino core 3.3.12) so every laptop builds the same firmware.

[platformio]
src_dir = tactile_hand
default_envs = left

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 921600

[env:left]
build_flags = -DTACTILE_HAND_RIGHT=0

[env:right]
build_flags = -DTACTILE_HAND_RIGHT=1

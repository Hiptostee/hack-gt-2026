ekf_filter_node:
  ros__parameters:
    # ICP owns the pose trajectory. Visual odometry contributes body-frame
    # velocity, not a second independently drifting world-frame position.
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, true,
                   true, true, true,
                   false, false, false]
    odom1_config: [true, true, true,
                   true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    # Thresholds are Mahalanobis distances (sigmas), not metres. A 1-sigma
    # gate rejects too many ordinary corrections in a six-dimensional pose.
    odom1_pose_rejection_threshold: 5.0
    imu0_pose_rejection_threshold: 3.0
    imu0_twist_rejection_threshold: 3.0
    # Camera processing lags the 100-Hz IMU. Rewind/replay the filter so
    # delayed odometry is applied at its measurement time.
    smooth_lagged_data: true
    history_length: 0.6
    print_diagnostics: true
